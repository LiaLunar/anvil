name: codeql

# CodeQL code scanning in advanced setup. The C++ is built for real on
# Windows, as in build.yml, so CodeQL sees the code as MSVC compiles it (the
# default setup analyses it without a build on Linux, where the Windows
# headers are missing). The workflows and the Rust SDK are analysed without a build.
# Results go to Security -> Code scanning. Pushes and pull requests that
# change only documentation or release files skip it; the weekly run still
# analyses main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - version.txt
      - .release-please-manifest.json
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - version.txt
      - .release-please-manifest.json
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request cancels its older runs of this workflow. Other
# runs (main, the weekly scan, a release's build) get a group of their own and
# are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  c-cpp:
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual

      # What ships, in parallel: version.dll, anvil.exe, the Manager and the standard plugins.
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DANVIL_BUILD_TESTS=OFF -DANVIL_BUILD_EXAMPLES=OFF -DANVIL_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
          upload: never
          output: sarif-results

      # build/_deps holds the third-party sources CMake fetches and compiles;
      # their alerts belong upstream, so they are left out of the upload.
      - name: Drop results in fetched dependencies
        shell: python
        run: |
          import json
          path = "sarif-results/cpp.sarif"
          with open(path, encoding="utf-8") as f:
              sarif = json.load(f)
          def uri(result):
              locations = result.get("locations") or [{}]
              return locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
          for run in sarif["runs"]:
              kept = [r for r in run.get("results", []) if not uri(r).startswith("build/")]
              print(f"kept {len(kept)} of {len(run.get('results', []))} results")
              run["results"] = kept
          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results/cpp.sarif
          category: /language:c-cpp

  no-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}

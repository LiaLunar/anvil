name: codeql

# CodeQL code scanning in advanced setup. The C++ is built for real on
# Windows, as in build.yml, so CodeQL sees the code as MSVC compiles it (the
# default setup analyses it without a build on Linux, where the Windows
# headers are missing). The workflows and the Rust SDK are analysed without a build.
# Results go to Security -> Code scanning. Pushes and pull requests that
# change only documentation or release files skip it; the weekly run still
# analyses main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - version.txt
      - .release-please-manifest.json
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - version.txt
      - .release-please-manifest.json
  schedule:
    - cron: "17 4 * * 1"

# A new push to a pull request cancels its older runs of this workflow. Other
# runs (main, the weekly scan, a release's build) get a group of their own and
# are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A pull request that changes no input of the C/C++ build CodeQL traces skips
  # c-cpp: the analysis takes minutes on Windows and would find what main's last
  # one found. Inputs: sources, headers, resources, CMake files, the TOML that
  # `anvil gen` turns into headers, this workflow; files under tests/ do not
  # count (CodeQL builds without the tests). Pushes to main and the weekly run
  # always analyse.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      cpp: ${{ steps.files.outputs.cpp }}
    steps:
      - name: C/C++ inputs changed
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          CPP_INPUTS: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|inl|ipp|rc|def|toml)$|(^|/)CMakeLists\.txt$|\.cmake$|^\.github/workflows/codeql\.yml$|^\.gitmodules$'
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          cpp=false
          # The API lists at most 3000 files: a larger pull request is analysed.
          if [ "$(wc -l < files.txt)" -ge 3000 ] || grep -E -v '(^|/)tests?/' files.txt | grep -E -q "$CPP_INPUTS"; then
            cpp=true
          fi
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"
          echo "C/C++ inputs changed: $cpp"

  c-cpp:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The FetchContent sources and sub-builds, keyed on the CMake files that pin
      # them (a key of its own: build.yml configures them with Ninja).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/_deps/*-src
            build/_deps/*-subbuild
          key: fetchcontent-vs-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}

      # What ships, in parallel: version.dll, anvil.exe, the Manager and the standard plugins.
      # Configure and the third-party libraries (Zydis, SafetyHook, miniz, the two ImGui
      # builds) run before init, so CodeQL neither traces nor analyses them (their
      # results were dropped from the upload anyway).
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DANVIL_BUILD_TESTS=OFF -DANVIL_BUILD_EXAMPLES=OFF -DANVIL_BUILD_BENCH=OFF

      - name: Third-party libraries
        run: >-
          cmake --build build --config Release --parallel
          --target Zycore Zydis safetyhook anvil_miniz anvil_manager_imgui anvil_overlay_imgui

      # Not tools: linked here, unlike the plugins: the traced build took 350 and 429 s
      # in the two runs with the linked bundle (2.27.3), 126 and 129 s in the two with
      # the default one (2.27.4). Before the libraries were built first, main's traced
      # builds took 200-474 s.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:c-cpp
          upload: never
          output: sarif-results

      # build/_deps holds the third-party sources CMake fetches and compiles;
      # their alerts belong upstream, so they are left out of the upload.
      - name: Drop results in fetched dependencies
        shell: python
        run: |
          import json
          path = "sarif-results/cpp.sarif"
          with open(path, encoding="utf-8") as f:
              sarif = json.load(f)
          def uri(result):
              locations = result.get("locations") or [{}]
              return locations[0].get("physicalLocation", {}).get("artifactLocation", {}).get("uri", "")
          for run in sarif["runs"]:
              kept = [r for r in run.get("results", []) if not uri(r).startswith("build/")]
              print(f"kept {len(kept)} of {len(run.get('results', []))} results")
              run["results"] = kept
          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: sarif-results/cpp.sarif
          category: /language:c-cpp

  no-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
